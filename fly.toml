# fly.toml app configuration file generated for post-scheduler-sutra on 2026-08-14T01:38:52+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'post-scheduler-sutra'
primary_region = 'bom'

[build]
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'scheduler_uploads'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[env]
  MONGODB_DB_NAME = 'scheduler'
  UPLOADS_DIR = '/data/uploads'
  FB_GRAPH_VERSION = 'v21.0'
  COOKIE_SECURE = 'true'
  FRONTEND_BASE_URL = 'https://post-scheduler-sutra.fly.dev'
  FB_OAUTH_REDIRECT_URI = 'https://post-scheduler-sutra.fly.dev/api/social/facebook/callback'
  PUBLIC_BASE_URL = 'https://post-scheduler-sutra.fly.dev'
